# ports.conf — the TCP ports the two HTTP services listen on.
#
# This is the one place either port needs setting. Consumers, all of which
# use the precedence "environment variable > this file > built-in default":
#
#   RINGRPQ_BACKEND_PORT   default 8000
#       uvicorn's --port for backend/app/main.py — the API, and in
#       production the built frontend served from the same origin.
#       Read by: ports.sh (-> deploy/install-units.sh -> the systemd unit),
#       frontend/vite.config.js (which API the dev server talks to).
#
#   RINGRPQ_XPATH_PORT     default 8080
#       XPathRingRPQ's Spring Boot server.
#       Read by: XPathRingRPQ's application.properties (server.port),
#       backend/app/config.py (derives XPATHRINGRPQ_URL when that isn't set
#       explicitly), ports.sh (-> the systemd units).
#
# Postgres's port is deliberately not here: it belongs to DATABASE_URL in
# backend/.env, which also carries the credentials and database name.
#
# A port changed here applies to anything started afterwards. The systemd
# units are the exception — install-units.sh bakes the numbers into them, so
# after editing this file re-run:
#
#   sudo -E ./deploy/install-units.sh && sudo systemctl restart ringrpq.target
#
# That is enough on its own — the unit passes --server.port to the JVM, so no
# Java rebuild is involved. The one case that does need care is running the
# packaged jar by hand: application.properties is copied inside the jar at
# package time, so a jar built before a port change still serves the old
# port. Either repackage (./mvnw -DskipTests package) or, simpler, pass the
# port the way the unit does:
#
#   java -jar target/demo-0.0.1-SNAPSHOT.jar --server.port=$RINGRPQ_XPATH_PORT
#
# `./mvnw spring-boot:run` is unaffected: it re-processes the file each run.
#
# If you would rather not edit a tracked file on a server, exporting
# RINGRPQ_BACKEND_PORT / RINGRPQ_XPATH_PORT in the environment overrides it
# (for install-units.sh, remember `sudo -E` so the values survive sudo).

RINGRPQ_BACKEND_PORT=8001
RINGRPQ_XPATH_PORT=8080
