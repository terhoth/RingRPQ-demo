# This service does pure XPath -> Ring-RPQ syntax translation and touches no
# database: HelloController's /translate endpoint runs the ANTLR pipeline and
# nothing else. spring-boot-starter-jdbc + the postgresql driver are still on
# the classpath (see pom.xml), so Spring Boot would otherwise try to
# auto-configure a DataSource from a URL that was never valid
# (jdbc:postgresql://localhost:5432/ has no database name). Excluding the
# auto-configuration is honest about that, and makes startup independent of
# whether Postgres happens to be up.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# The listening port, so it can be moved when 8080 is taken on the host.
# RINGRPQ_XPATH_PORT comes from ports.conf at the repo root, exported by
# ports.sh; the backend reads the same file to build XPATHRINGRPQ_URL.
#
# This covers `./mvnw spring-boot:run`, which re-processes this file on every
# run. It does NOT reliably cover a packaged jar: this file is copied into
# BOOT-INF/classes at package time, so a jar built before a port change keeps
# the old value until `./mvnw -DskipTests package` runs again. That is why
# ringrpq-xpath.service passes --server.port on the command line instead of
# depending on this line.
server.port=${RINGRPQ_XPATH_PORT:8080}


# If you later want this service on the shared ringrpq database (e.g. to log
# translated queries), drop the exclude above and set:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/ringrpq
#   spring.datasource.username=ringrpq
#   spring.datasource.password=ringrpq
